name: TheDailyJob 24x7 Cloud Auto Post

on:
  workflow_dispatch:
  schedule:
    # Har 10 minute me Cloud par chalega (laptop band hone par bhi)
    - cron: "*/10 * * * *"

concurrency:
  group: thedailyjob-cloud-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Auto Poster
        env:
          APP_ENV: production
          PUBLISH_TARGET: cloudflare
          CLOUDFLARE_API_URL: https://thedailyjob-worker.cricketsikho.workers.dev/api/publish
          CLOUDFLARE_API_TOKEN: tdj_auto_post_secret_key_2026
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-lite-latest
          DATABASE_URL: sqlite:///data/job_portal.db
        run: |
          python -m app.main --limit 10

      - name: Commit & Push DB State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/job_portal.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Auto-update job portal state [skip ci]"
            git push origin main || true
          fi
